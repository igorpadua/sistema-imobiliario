services:
  postgres:
    image: postgis/postgis:${POSTGIS_VERSION}
    container_name: postgres_container
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD_IMOVEIS_DONO: ${DB_PASSWORD_IMOVEIS_DONO}
      DB_PASSWORD_IMOVEIS_APP: ${DB_PASSWORD_IMOVEIS_APP}
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=pt-BR'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -h postgres" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

  kafka:
    image: confluentinc/cp-kafka:${CP_VERSION}
    container_name: cp_kafka_container
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      CLUSTER_ID: YSQqrpfgTcSRLh8aHRsuoA
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094

    ports:
      - "9092:9092"

volumes:
  postgres_data: